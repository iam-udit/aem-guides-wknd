# ============================================================
# Release Cut — Continue After Conflict Resolution
# ============================================================
# Run this ONLY when the back-merge had conflicts and the
# conflict-resolution PR has been merged into develop.
# Use the EXACT same inputs as the original release-cut.yml run.
# ============================================================

name: Release Cut — Continue After Conflict Resolution

on:
  workflow_dispatch:
    inputs:
      prev_release_branch:
        description: "Previous release branch  (e.g. release-2.02.0-loki)"
        required: true
        type: string
      prev_version:
        description: "Previous release version number  (e.g. 2.02.0)"
        required: true
        type: string
      new_version:
        description: "New release version number  (e.g. 2.03.0)"
        required: true
        type: string
      new_codename:
        description: "New release codename  (e.g. minotaur)"
        required: true
        type: string
      new_version_label:
        description: "New Jira fix-version label  (e.g. AEM 2.03.0 - Minotaur)"
        required: true
        type: string
      jira_release_ticket:
        description: "Jira release ticket key  (e.g. ADCMS-9999)"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        default: false
        type: boolean

env:
  NEW_RELEASE_BRANCH:  "release-${{ inputs.new_version }}-${{ inputs.new_codename }}"
  PREV_RELEASE_BRANCH: "${{ inputs.prev_release_branch }}"
  NEW_VERSION:         "${{ inputs.new_version }}"
  PREV_VERSION:        "${{ inputs.prev_version }}"
  NEW_VERSION_LABEL:   "${{ inputs.new_version_label }}"
  NEW_PRERELEASE_TAG:  "${{ inputs.new_version }}-beta"
  PREV_LATEST_TAG:     "${{ inputs.prev_version }}"
  PREV_PRERELEASE_TAG: "${{ inputs.prev_version }}-beta"
  DRY_RUN:             "${{ inputs.dry_run }}"

jobs:
  verify_develop:
    name: "✔ Verify conflict PR is merged into develop"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Check develop contains all commits from previous release branch
        run: |
          git fetch origin "${{ env.PREV_RELEASE_BRANCH }}"
          UNMERGED=$(git log HEAD..origin/"${{ env.PREV_RELEASE_BRANCH }}" --oneline)
          if [ -n "$UNMERGED" ]; then
            echo "::error::develop is missing commits from ${{ env.PREV_RELEASE_BRANCH }}"
            echo "::error::Ensure the conflict-resolution PR is merged before running this."
            exit 1
          fi
          echo "✅ develop is up to date — safe to continue"

  cut_release_branch:
    name: "2 · Cut release-${{ inputs.new_version }}-${{ inputs.new_codename }} from develop"
    runs-on: ubuntu-latest
    needs: verify_develop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - run: |
          git config user.name  "ADCMS Release Bot"
          git config user.email "adcms-bot@ibm.com"
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would create: ${{ env.NEW_RELEASE_BRANCH }}" && exit 0
          git checkout -b "${{ env.NEW_RELEASE_BRANCH }}"
          git push origin "${{ env.NEW_RELEASE_BRANCH }}"
          echo "✅ Created: ${{ env.NEW_RELEASE_BRANCH }}"

  rotate_tags:
    name: "3 · Delete ${{ inputs.prev_version }}-beta, create ${{ inputs.prev_version }} + ${{ inputs.new_version }}-beta"
    runs-on: ubuntu-latest
    needs: cut_release_branch
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Delete previous pre-release tag (${{ env.PREV_PRERELEASE_TAG }})
        run: |
          TAG="${{ env.PREV_PRERELEASE_TAG }}"
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would delete: $TAG" && exit 0
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          echo "✅ Deleted: $TAG"
      - name: Create latest tag for previous release (${{ env.PREV_LATEST_TAG }})
        run: |
          TAG="${{ env.PREV_LATEST_TAG }}"
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would create: $TAG on ${{ env.PREV_RELEASE_BRANCH }}" && exit 0
          gh release create "$TAG" \
            --target "${{ env.PREV_RELEASE_BRANCH }}" \
            --title  "Release ${{ env.PREV_VERSION }}" \
            --notes  "Stable release — ${{ env.PREV_VERSION }}" \
            --latest
          echo "✅ Created: $TAG → ${{ env.PREV_RELEASE_BRANCH }}"
      - name: Create pre-release tag for new release (${{ env.NEW_PRERELEASE_TAG }})
        run: |
          TAG="${{ env.NEW_PRERELEASE_TAG }}"
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would create: $TAG on ${{ env.NEW_RELEASE_BRANCH }}" && exit 0
          gh release create "$TAG" \
            --target "${{ env.NEW_RELEASE_BRANCH }}" \
            --title  "Pre-release ${{ env.NEW_VERSION }}" \
            --notes  "Pre-release — ${{ env.NEW_VERSION_LABEL }}" \
            --prerelease
          echo "✅ Created: $TAG → ${{ env.NEW_RELEASE_BRANCH }}"

  adobe_cloud_manager:
    name: "4 · Adobe Cloud Manager"
    runs-on: ubuntu-latest
    needs: rotate_tags
    steps:
      - id: acm_auth
        run: |
          RESPONSE=$(curl -s -X POST "https://ims-na1.adobelogin.com/ims/token/v3" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${{ vars.ACM_CLIENT_ID }}&client_secret=${{ secrets.ACM_CLIENT_SECRET }}&scope=openid,AdobeID,read_organizations,additional_info.projectedProductContext")
          TOKEN=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).access_token))")
          echo "::add-mask::$TOKEN"
          echo "acm_token=$TOKEN" >> "$GITHUB_OUTPUT"
      - run: |
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would patch + trigger ACM pipeline" && exit 0
          PIPELINE=$(curl -s \
            -H "Authorization: Bearer ${{ steps.acm_auth.outputs.acm_token }}" \
            -H "x-gw-ims-org-id: ${{ vars.ACM_ORG_ID }}" \
            "https://cloudmanager.adobe.io/api/program/${{ vars.ACM_PROGRAM_ID }}/pipeline/${{ vars.ACM_PIPELINE_ID }}")
          UPDATED=$(echo "$PIPELINE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const p=JSON.parse(d);(p.phases||[]).forEach(ph=>{if(ph.type==='BUILD')ph.branch='${{ env.NEW_RELEASE_BRANCH }}'});console.log(JSON.stringify(p))})")
          curl -s -X PUT \
            "https://cloudmanager.adobe.io/api/program/${{ vars.ACM_PROGRAM_ID }}/pipeline/${{ vars.ACM_PIPELINE_ID }}" \
            -H "Authorization: Bearer ${{ steps.acm_auth.outputs.acm_token }}" \
            -H "x-gw-ims-org-id: ${{ vars.ACM_ORG_ID }}" \
            -H "Content-Type: application/json" -d "$UPDATED"
          curl -s -o /dev/null -w "Trigger HTTP %{http_code}\n" -X PUT \
            "https://cloudmanager.adobe.io/api/program/${{ vars.ACM_PROGRAM_ID }}/pipeline/${{ vars.ACM_PIPELINE_ID }}/execution" \
            -H "Authorization: Bearer ${{ steps.acm_auth.outputs.acm_token }}" \
            -H "x-gw-ims-org-id: ${{ vars.ACM_ORG_ID }}" \
            -H "Content-Type: application/json"

  jira_release:
    name: "5 · Jira — classify tickets, create filter, update release ticket"
    runs-on: ubuntu-latest
    needs: rotate_tags
    outputs:
      confirmed_tickets:     ${{ steps.classify.outputs.confirmed_tickets }}
      untagged_open_tickets: ${{ steps.classify.outputs.untagged_open_tickets }}
      ticket_count:          ${{ steps.classify.outputs.ticket_count }}
      filter_url:            ${{ steps.create_filter.outputs.filter_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - id: extract
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PREV_TAG="${{ env.PREV_LATEST_TAG }}"
          NEW_TAG="${{ env.NEW_PRERELEASE_TAG }}"
          echo "Comparing $PREV_TAG → $NEW_TAG"
          COMMITS=$(git log "${PREV_TAG}..${NEW_TAG}" --pretty=format:"%s %b" 2>/dev/null \
                    || git log "origin/${{ env.PREV_RELEASE_BRANCH }}..origin/${{ env.NEW_RELEASE_BRANCH }}" --pretty=format:"%s %b")
          TICKETS=$(echo "$COMMITS" | grep -oE 'ADCMS-[0-9]{4,}' | sort -u | tr '\n' ',')
          echo "raw_tickets=$TICKETS" >> "$GITHUB_OUTPUT"
          echo "Raw tickets: $TICKETS"
      - id: classify
        run: node scripts/classify_tickets.js
        env:
          JIRA_BASE_URL:      ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:    ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:     ${{ secrets.JIRA_API_TOKEN }}
          RAW_TICKETS:        ${{ steps.extract.outputs.raw_tickets }}
          NEW_VERSION_LABEL:  ${{ env.NEW_VERSION_LABEL }}
          PREV_VERSION_LABEL: ""
      - id: create_filter
        run: node scripts/update_jira_filter.js
        env:
          JIRA_BASE_URL:     ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:   ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:    ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:  ${{ vars.JIRA_PROJECT_KEY }}
          NEW_VERSION_LABEL: ${{ env.NEW_VERSION_LABEL }}
          DRY_RUN:           ${{ env.DRY_RUN }}
      - run: node scripts/update_release_ticket.js
        env:
          JIRA_BASE_URL:         ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:       ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:        ${{ secrets.JIRA_API_TOKEN }}
          JIRA_RELEASE_TICKET:   ${{ inputs.jira_release_ticket }}
          FILTER_URL:            ${{ steps.create_filter.outputs.filter_url }}
          NEW_VERSION_LABEL:     ${{ env.NEW_VERSION_LABEL }}
          CONFIRMED_TICKETS:     ${{ steps.classify.outputs.confirmed_tickets }}
          UNTAGGED_OPEN_TICKETS: ${{ steps.classify.outputs.untagged_open_tickets }}
          DRY_RUN:               ${{ env.DRY_RUN }}

  notify_open_prs:
    name: "6 · Notify open PRs"
    runs-on: ubuntu-latest
    needs: [jira_release, adobe_cloud_manager]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - run: node scripts/notify_prs.js
        env:
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
          GITHUB_SERVER_URL:  ${{ github.server_url }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          NEW_RELEASE_BRANCH: ${{ env.NEW_RELEASE_BRANCH }}
          NEW_VERSION:        ${{ env.NEW_VERSION }}
          NEW_VERSION_LABEL:  ${{ env.NEW_VERSION_LABEL }}

  notify_slack_final:
    name: "7 · Slack summary"
    runs-on: ubuntu-latest
    needs: [adobe_cloud_manager, jira_release, notify_open_prs]
    if: always()
    steps:
      - name: Checkout (needed for slack.js)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Post summary to Slack
        run: node scripts/slack.js
        env:
          SLACK_WEBHOOK_URL:    ${{ vars.SLACK_WEBHOOK_URL }}
          NOTIFICATION_TYPE:    summary
          NEW_VERSION_LABEL:    ${{ env.NEW_VERSION_LABEL }}
          NEW_RELEASE_BRANCH:   ${{ env.NEW_RELEASE_BRANCH }}
          NEW_PRERELEASE_TAG:   ${{ env.NEW_PRERELEASE_TAG }}
          PREV_LATEST_TAG:      ${{ env.PREV_LATEST_TAG }}
          PREV_RELEASE_BRANCH:  ${{ env.PREV_RELEASE_BRANCH }}
          TICKET_COUNT:         ${{ needs.jira_release.outputs.ticket_count }}
          FILTER_URL:           ${{ needs.jira_release.outputs.filter_url }}
          JIRA_RELEASE_TICKET:  ${{ inputs.jira_release_ticket }}
          UNTAGGED_TICKETS:     ${{ needs.jira_release.outputs.untagged_open_tickets }}
          ACM_RESULT:           ${{ needs.adobe_cloud_manager.result }}
          JIRA_RESULT:          ${{ needs.jira_release.result }}
          PRS_RESULT:           ${{ needs.notify_open_prs.result }}
          GITHUB_ACTOR:         ${{ github.actor }}
          RUN_NUMBER:           ${{ github.run_number }}
          RUN_URL:              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
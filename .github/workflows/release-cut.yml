# ============================================================
# Release Cut Workflow - ADCMS Team (v2)
# ============================================================
# Trigger: Manual (workflow_dispatch) from GitHub Actions UI
#
# Secrets required (Repo → Settings → Secrets and variables → Actions):
#
#   GH_TOKEN              GitHub PAT (repo + workflow scopes)
#   JIRA_BASE_URL         https://jsw.ibm.com
#   JIRA_USER_EMAIL       Your IBM Jira login email
#   JIRA_API_TOKEN        Jira API token
#   JIRA_PROJECT_KEY      ADCMS
#   ACM_CLIENT_ID         Adobe Cloud Manager OAuth client ID
#   ACM_CLIENT_SECRET     Adobe Cloud Manager OAuth client secret
#   ACM_ORG_ID            Adobe IMS org ID
#   ACM_PROGRAM_ID        Cloud Manager program ID
#   ACM_PIPELINE_ID       Stage pipeline ID
#   SLACK_WEBHOOK_URL     Incoming webhook for your release channel
# ============================================================

name: IBM CMS Release Cut

on:
  workflow_dispatch:
    inputs:
      prev_release_branch:
        description: "Previous release branch  (e.g. release-2.02.0-loki)"
        required: true
        type: string
      prev_version:
        description: "Previous release version number  (e.g. 2.02.0)"
        required: true
        type: string
      new_version:
        description: "New release version number  (e.g. 2.03.0)"
        required: true
        type: string
      new_codename:
        description: "New release codename  (e.g. minotaur)"
        required: true
        type: string
      new_version_label:
        description: "New Jira fix-version label  (e.g. AEM 2.03.0 - Minotaur)"
        required: true
        type: string
      jira_release_ticket:
        description: "Jira release ticket key  (e.g. ADCMS-9999)"
        required: true
        type: string
      dry_run:
        description: "Dry run — log all steps but make no actual changes"
        required: false
        default: false
        type: boolean

env:
  # Branch naming: release-2.03.0-minotaur
  NEW_RELEASE_BRANCH:  "release-${{ inputs.new_version }}-${{ inputs.new_codename }}"
  PREV_RELEASE_BRANCH: "${{ inputs.prev_release_branch }}"
  NEW_VERSION:         "${{ inputs.new_version }}"
  PREV_VERSION:        "${{ inputs.prev_version }}"
  NEW_VERSION_LABEL:   "${{ inputs.new_version_label }}"
  # Tag naming: 2.03.0-beta  (pre-release) and 2.02.0 (latest for prev)
  NEW_PRERELEASE_TAG:  "${{ inputs.new_version }}-beta"
  PREV_LATEST_TAG:     "${{ inputs.prev_version }}"
  PREV_PRERELEASE_TAG: "${{ inputs.prev_version }}-beta"
  DRY_RUN:             "${{ inputs.dry_run }}"


# ============================================================
# JOB 1 — Back-merge previous release branch → develop (always via PR)
# ============================================================
jobs:
  back_merge:
    name: "1 · Back-merge ${{ inputs.prev_release_branch }} → develop (PR)"
    runs-on: ubuntu-latest
    outputs:
      had_conflict: ${{ steps.merge.outputs.had_conflict }}
      conflict_files: ${{ steps.merge.outputs.conflict_files }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "ADCMS Release Bot"
          git config user.email "adcms-bot@ibm.com"

      - name: Clean up existing back-merge branch and pull request if present
        id: cleanup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_BRANCH="chore/back-merge-${{ inputs.prev_release_branch }}"
          
          # Check if branch exists remotely
          if git ls-remote --heads origin "$PR_BRANCH" | grep -q "$PR_BRANCH"; then
            echo "Existing branch found: $PR_BRANCH"
            
            # Check if there's an open PR for this branch
            PR_NUMBER=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            
            if [ -n "$PR_NUMBER" ]; then
              echo "Found open pull request #$PR_NUMBER for branch $PR_BRANCH"
              echo "Closing existing pull request to create fresh one"
              gh pr close "$PR_NUMBER" --comment "Closing this pull request to create a fresh back-merge. A new pull request will be created automatically." || true
            fi
            
            # Delete the remote branch
            echo "Deleting existing remote branch: $PR_BRANCH"
            git push origin --delete "$PR_BRANCH" 2>/dev/null || true
          else
            echo "No existing branch found - proceeding with fresh creation"
          fi

      - name: Attempt merge into a PR branch
        id: merge
        run: |
          # Always work on a dedicated branch — we always raise a PR
          PR_BRANCH="chore/back-merge-${{ inputs.prev_release_branch }}"
          git fetch origin "${{ env.PREV_RELEASE_BRANCH }}"
          git checkout -b "$PR_BRANCH"

          git merge --no-ff "origin/${{ env.PREV_RELEASE_BRANCH }}" \
            -m "chore(release): back-merge ${{ env.PREV_RELEASE_BRANCH }} into develop" \
            || true

          CONFLICTS=$(git diff --name-only --diff-filter=U)

          if [ -n "$CONFLICTS" ]; then
            echo "had_conflict=true" >> "$GITHUB_OUTPUT"
            CONFLICT_LIST=$(echo "$CONFLICTS" | tr '\n' ',')
            echo "conflict_files=$CONFLICT_LIST" >> "$GITHUB_OUTPUT"
            # Stage conflict markers so PR diff is visible
            git add -A
            git commit -m "chore(release): back-merge ${{ env.PREV_RELEASE_BRANCH }} [CONFLICTS — needs resolution]"
            echo "⚠️  Conflicts in: $CONFLICTS"
          else
            echo "had_conflict=false" >> "$GITHUB_OUTPUT"
            echo "conflict_files="    >> "$GITHUB_OUTPUT"
            echo "✅ Clean merge"
          fi

          echo "pr_branch=$PR_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Push PR branch
        if: env.DRY_RUN == 'false'
        run: git push origin "${{ steps.merge.outputs.pr_branch }}"

      - name: Create back-merge PR
        id: create_pr
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          HAS_CONFLICT="${{ steps.merge.outputs.had_conflict }}"

          if [ "$HAS_CONFLICT" = "true" ]; then
            TITLE="chore(release): back-merge ${{ env.PREV_RELEASE_BRANCH }} ⚠️ CONFLICTS"
            BODY="## ⚠️ Merge Conflicts — Action Required

          Back-merging \`${{ env.PREV_RELEASE_BRANCH }}\` into \`develop\` produced conflicts.

          **Conflicting files:**
          $(echo "${{ steps.merge.outputs.conflict_files }}" | tr ',' '\n' | sed 's/^/- /')

          **What to do:**
          1. Check out branch \`${{ steps.merge.outputs.pr_branch }}\` locally
          2. Resolve all conflict markers (\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`)
          3. Commit the resolution and push
          4. Approve and merge this PR into \`develop\`
          5. Then trigger **\`release-cut-continue.yml\`** manually with the same inputs

          > Auto-created by Release Cut workflow run #${{ github.run_number }}"
          else
            TITLE="chore(release): back-merge ${{ env.PREV_RELEASE_BRANCH }} → develop ✅"
            BODY="## Clean back-merge

          Automated back-merge of \`${{ env.PREV_RELEASE_BRANCH }}\` into \`develop\`.
          No conflicts detected — ready to merge.

          > Auto-created by Release Cut workflow run #${{ github.run_number }}"
          fi

          PR_URL=$(gh pr create \
            --base develop \
            --head "${{ steps.merge.outputs.pr_branch }}" \
            --title "$TITLE" \
            --body  "$BODY")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR created: $PR_URL"

      - name: Notify Slack — conflict needs resolution
        if: steps.merge.outputs.had_conflict == 'true' && env.DRY_RUN == 'false'
        run: node scripts/slack.js
        env:
          SLACK_WEBHOOK_URL:  ${{ vars.SLACK_WEBHOOK_URL }}
          NOTIFICATION_TYPE:  conflict
          NEW_VERSION_LABEL:  ${{ env.NEW_VERSION_LABEL }}
          PREV_RELEASE_BRANCH: ${{ env.PREV_RELEASE_BRANCH }}
          GITHUB_ACTOR:       ${{ github.actor }}
          CONFLICT_FILES:     ${{ steps.merge.outputs.conflict_files }}
          PR_URL:             ${{ steps.create_pr.outputs.pr_url }}
          RUN_NUMBER:         ${{ github.run_number }}

      - name: Notify Slack — clean PR raised
        if: steps.merge.outputs.had_conflict == 'false' && env.DRY_RUN == 'false'
        run: node scripts/slack.js
        env:
          SLACK_WEBHOOK_URL:  ${{ vars.SLACK_WEBHOOK_URL }}
          NOTIFICATION_TYPE:  clean_pr
          NEW_VERSION_LABEL:  ${{ env.NEW_VERSION_LABEL }}
          GITHUB_ACTOR:       ${{ github.actor }}
          PR_URL:             ${{ steps.create_pr.outputs.pr_url }}
          RUN_NUMBER:         ${{ github.run_number }}

      - name: Summarise result for approval gate
        run: |
          if [ "${{ steps.merge.outputs.had_conflict }}" = "true" ]; then
            echo "⚠️  Conflicts detected in back-merge PR."
            echo "    1. Resolve conflicts and merge the PR into develop"
            echo "    2. Then come back here → Review deployments → Approve"
          else
            echo "✅ Clean merge — PR raised with no conflicts."
            echo "    1. Merge the PR into develop"
            echo "    2. Then come back here → Review deployments → Approve"
          fi


# ============================================================
# JOB 1b — Wait for back-merge PR to be merged
# ============================================================
# Workflow actively polls the PR status and waits until it's merged.
# This ensures the PR is actually merged before proceeding to Job 2.
#
# What to do:
#   1. Open the PR link from Slack notification
#   2. Review the changes
#   3. If conflicts exist: resolve them, commit, and push
#   4. Merge the PR into develop
#   5. This workflow will automatically continue once the PR is merged
#
# The polling mechanism checks PR status every 30 seconds and times out
# after 2 hours if the PR is not merged.
# ============================================================
  await_pr_merge:
    name: "1b · ⏸ Waiting for back-merge PR to be merged"
    runs-on: ubuntu-latest
    needs: back_merge

    steps:
      - name: Wait for PR to be merged into develop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_URL: ${{ needs.back_merge.outputs.pr_url }}
        run: |
          echo "⏳ Waiting for back-merge PR to be merged into develop..."
          echo "PR URL: $PR_URL"
          echo ""
          echo "📋 Instructions:"
          echo "  1. Open the PR: $PR_URL"
          echo "  2. Review the changes"
          echo "  3. If conflicts exist: resolve them, commit, and push"
          echo "  4. Merge the PR into develop"
          echo "  5. This workflow will automatically continue once merged"
          echo ""
          
          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not extract PR number from URL: $PR_URL"
            exit 1
          fi
          
          echo "Monitoring PR #$PR_NUMBER..."
          echo ""
          
          MAX_WAIT=7200  # 2 hours timeout
          INTERVAL=30    # Check every 30 seconds
          ELAPSED=0
          CHECK_COUNT=0
          
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            CHECK_COUNT=$((CHECK_COUNT + 1))
            
            # Check PR status using GitHub CLI
            PR_STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            
            if [ "$PR_STATE" = "MERGED" ]; then
              echo ""
              echo "✅ PR #$PR_NUMBER has been merged into develop"
              echo "Proceeding with release cut..."
              exit 0
            elif [ "$PR_STATE" = "CLOSED" ]; then
              echo ""
              echo "::error::PR #$PR_NUMBER was closed without merging"
              echo "::error::Please reopen and merge the PR, or restart the workflow"
              exit 1
            elif [ "$PR_STATE" = "OPEN" ]; then
              MINUTES_ELAPSED=$((ELAPSED / 60))
              MINUTES_REMAINING=$(((MAX_WAIT - ELAPSED) / 60))
              echo "[Check #$CHECK_COUNT] PR #$PR_NUMBER is still open - waiting... (${MINUTES_ELAPSED}m elapsed, ${MINUTES_REMAINING}m remaining)"
            else
              echo "[Check #$CHECK_COUNT] ⚠️  Could not determine PR state (received: $PR_STATE)"
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          echo ""
          echo "::error::Timeout: PR #$PR_NUMBER was not merged within $((MAX_WAIT/60)) minutes"
          echo "::error::Please merge the PR manually and re-run the workflow"
          exit 1


# ============================================================
# JOB 2 — Cut new release branch from develop
# ============================================================
  cut_release_branch:
    name: "2 · Cut release-${{ inputs.new_version }}-${{ inputs.new_codename }} from develop"
    runs-on: ubuntu-latest
    needs: await_pr_merge

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "ADCMS Release Bot"
          git config user.email "adcms-bot@ibm.com"

      - name: Create and push release branch
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would create: ${{ env.NEW_RELEASE_BRANCH }}"; exit 0
          fi
          git checkout -b "${{ env.NEW_RELEASE_BRANCH }}"
          git push origin "${{ env.NEW_RELEASE_BRANCH }}"
          echo "✅ Branch created: ${{ env.NEW_RELEASE_BRANCH }}"


# ============================================================
# JOB 3 — Rotate tags
#
# On release cut for 2.03.0-minotaur:
#   DELETE  2.02.0-beta          (previous pre-release tag)
#   CREATE  2.02.0               (latest tag for previous branch)
#   CREATE  2.03.0-beta          (pre-release tag for new branch)
# ============================================================
  rotate_tags:
    name: "3 · Rotate tags — delete ${{ inputs.prev_version }}-beta, create ${{ inputs.prev_version }} + ${{ inputs.new_version }}-beta"
    runs-on: ubuntu-latest
    needs: cut_release_branch
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Delete previous pre-release tag (${{ env.PREV_PRERELEASE_TAG }})
        run: |
          TAG="${{ env.PREV_PRERELEASE_TAG }}"
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would delete tag: $TAG" && exit 0
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG"      2>/dev/null || true
          echo "✅ Deleted pre-release tag: $TAG"

      - name: Create latest tag for previous release (${{ env.PREV_LATEST_TAG }})
        run: |
          TAG="${{ env.PREV_LATEST_TAG }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would create latest tag: $TAG on ${{ env.PREV_RELEASE_BRANCH }}"
            exit 0
          fi
          
          # Extract codename from previous release branch (e.g., release-2.02.0-loki -> Loki)
          PREV_CODENAME=$(echo "${{ inputs.prev_release_branch }}" | sed -E 's/.*-([^-]+)$/\1/' | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          
          gh release create "$TAG" \
            --target "${{ env.PREV_RELEASE_BRANCH }}" \
            --title  "Release ${{ env.PREV_VERSION }} ${PREV_CODENAME}" \
            --notes  "Stable release - ${{ env.PREV_VERSION }} ${PREV_CODENAME}" \
            --latest
          echo "Created latest tag: $TAG on ${{ env.PREV_RELEASE_BRANCH }}"

      - name: Create pre-release tag for new release (${{ env.NEW_PRERELEASE_TAG }})
        run: |
          TAG="${{ env.NEW_PRERELEASE_TAG }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "[DRY RUN] Would create pre-release tag: $TAG on ${{ env.NEW_RELEASE_BRANCH }}"
            exit 0
          fi
          
          # Capitalize first letter of codename (e.g., minotaur -> Minotaur)
          NEW_CODENAME=$(echo "${{ inputs.new_codename }}" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')
          
          gh release create "$TAG" \
            --target "${{ env.NEW_RELEASE_BRANCH }}" \
            --title  "Release ${{ env.NEW_VERSION }} ${NEW_CODENAME}" \
            --notes  "Pre-release - ${{ env.NEW_VERSION }} ${NEW_CODENAME}" \
            --prerelease
          echo "Created pre-release tag: $TAG on ${{ env.NEW_RELEASE_BRANCH }}"


# ============================================================
# JOB 4 — Adobe Cloud Manager: update pipeline + trigger stage
# ============================================================
  adobe_cloud_manager:
    name: "4 · Adobe Cloud Manager — update branch + trigger stage"
    runs-on: ubuntu-latest
    needs: rotate_tags

    steps:
      - name: Get Adobe IMS access token
        id: acm_auth
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://ims-na1.adobelogin.com/ims/token/v3" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ vars.ACM_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ACM_CLIENT_SECRET }}" \
            -d "scope=openid,AdobeID,read_organizations,additional_info.projectedProductContext")
          TOKEN=$(echo "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).access_token))")
          echo "::add-mask::$TOKEN"
          echo "acm_token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Patch pipeline branch to new release branch
        run: |
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would patch ACM pipeline branch" && exit 0

          PIPELINE=$(curl -s \
            -H "Authorization: Bearer ${{ steps.acm_auth.outputs.acm_token }}" \
            -H "x-gw-ims-org-id: ${{ vars.ACM_ORG_ID }}" \
            "https://cloudmanager.adobe.io/api/program/${{ vars.ACM_PROGRAM_ID }}/pipeline/${{ vars.ACM_PIPELINE_ID }}")

          UPDATED=$(echo "$PIPELINE" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              const p = JSON.parse(d);
              (p.phases||[]).forEach(ph=>{ if(ph.type==='BUILD') ph.branch='${{ env.NEW_RELEASE_BRANCH }}'; });
              console.log(JSON.stringify(p));
            })")

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "https://cloudmanager.adobe.io/api/program/${{ vars.ACM_PROGRAM_ID }}/pipeline/${{ vars.ACM_PIPELINE_ID }}" \
            -H "Authorization: Bearer ${{ steps.acm_auth.outputs.acm_token }}" \
            -H "x-gw-ims-org-id: ${{ vars.ACM_ORG_ID }}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED")

          echo "Pipeline PATCH → HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "200" ] && echo "✅ Pipeline branch updated" || echo "::warning::PATCH returned $HTTP_CODE — verify in Cloud Manager"

      - name: Trigger stage pipeline execution
        run: |
          [ "$DRY_RUN" = "true" ] && echo "[DRY RUN] Would trigger stage build" && exit 0

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
            "https://cloudmanager.adobe.io/api/program/${{ vars.ACM_PROGRAM_ID }}/pipeline/${{ vars.ACM_PIPELINE_ID }}/execution" \
            -H "Authorization: Bearer ${{ steps.acm_auth.outputs.acm_token }}" \
            -H "x-gw-ims-org-id: ${{ vars.ACM_ORG_ID }}" \
            -H "Content-Type: application/json")

          echo "Pipeline trigger → HTTP $HTTP_CODE"
          [ "$HTTP_CODE" = "201" ] && echo "✅ Stage pipeline triggered" || echo "::warning::Trigger returned $HTTP_CODE — verify manually in Cloud Manager"


# ============================================================
# JOB 5 — Compare tags, classify tickets, update Jira filter
#          and update release ticket description
# ============================================================
  jira_release:
    name: "5 · Jira — compare tags, classify tickets, update filter + release ticket"
    runs-on: ubuntu-latest
    needs: rotate_tags
    outputs:
      confirmed_tickets: ${{ steps.classify.outputs.confirmed_tickets }}
      untagged_open_tickets: ${{ steps.classify.outputs.untagged_open_tickets }}
      ticket_count: ${{ steps.classify.outputs.ticket_count }}
      filter_url: ${{ steps.create_filter.outputs.filter_url }}

    steps:
      - name: Checkout (to run scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Extract ADCMS ticket IDs from tag comparison
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PREV_TAG="${{ env.PREV_LATEST_TAG }}"   # e.g. 2.02.0
          NEW_TAG="${{ env.NEW_PRERELEASE_TAG }}"  # e.g. 2.03.0-beta

          echo "Comparing $PREV_TAG → $NEW_TAG"

          # Get all commit messages between the two tags
          COMMITS=$(git log "${PREV_TAG}..${NEW_TAG}" --pretty=format:"%s %b" 2>/dev/null \
                    || git log "origin/${{ env.PREV_RELEASE_BRANCH }}..origin/${{ env.NEW_RELEASE_BRANCH }}" \
                       --pretty=format:"%s %b")

          TICKETS=$(echo "$COMMITS" \
            | grep -oE 'ADCMS-[0-9]{4,}' \
            | sort -u \
            | tr '\n' ',')

          echo "raw_tickets=$TICKETS" >> "$GITHUB_OUTPUT"
          echo "Raw tickets found: $TICKETS"

      - name: Classify tickets via Jira API
        id: classify
        run: node scripts/classify_tickets.js
        env:
          JIRA_BASE_URL:       ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:     ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:      ${{ secrets.JIRA_API_TOKEN }}
          RAW_TICKETS:         ${{ steps.extract.outputs.raw_tickets }}
          NEW_VERSION_LABEL:   ${{ env.NEW_VERSION_LABEL }}
          PREV_VERSION_LABEL:  ${{ env.PREV_VERSION_LABEL }}

      - name: Create new Jira release filter
        id: create_filter
        run: node scripts/update_jira_filter.js
        env:
          JIRA_BASE_URL:      ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:    ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:     ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY:   ${{ vars.JIRA_PROJECT_KEY }}
          NEW_VERSION_LABEL:  ${{ env.NEW_VERSION_LABEL }}
          DRY_RUN:            ${{ env.DRY_RUN }}

      - name: Update release ticket description
        run: node scripts/update_release_ticket.js
        env:
          JIRA_BASE_URL:          ${{ vars.JIRA_BASE_URL }}
          JIRA_USER_EMAIL:        ${{ vars.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN:         ${{ secrets.JIRA_API_TOKEN }}
          JIRA_RELEASE_TICKET:    ${{ inputs.jira_release_ticket }}
          FILTER_URL:             ${{ steps.create_filter.outputs.filter_url }}
          NEW_VERSION_LABEL:      ${{ env.NEW_VERSION_LABEL }}
          CONFIRMED_TICKETS:      ${{ steps.classify.outputs.confirmed_tickets }}
          UNTAGGED_OPEN_TICKETS:  ${{ steps.classify.outputs.untagged_open_tickets }}
          DRY_RUN:                ${{ env.DRY_RUN }}


# ============================================================
# JOB 6 — Notify open PRs targeting develop
# ============================================================
  notify_open_prs:
    name: "6 · Notify devs — open PRs targeting develop"
    runs-on: ubuntu-latest
    needs: [jira_release, adobe_cloud_manager]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Comment on open PRs
        run: node scripts/notify_prs.js
        env:
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
          GITHUB_SERVER_URL:  ${{ github.server_url }}
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          NEW_RELEASE_BRANCH: ${{ env.NEW_RELEASE_BRANCH }}
          NEW_VERSION:        ${{ env.NEW_VERSION }}
          NEW_VERSION_LABEL:  ${{ env.NEW_VERSION_LABEL }}


# ============================================================
# JOB 7 — Final Slack summary
# ============================================================
  notify_slack_final:
    name: "7 · Slack — release cut summary"
    runs-on: ubuntu-latest
    needs: [adobe_cloud_manager, jira_release, notify_open_prs]
    if: always()

    steps:
      - name: Checkout repository for Slack notification script
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Determine overall workflow status
        id: status
        run: |
          ACM="${{ needs.adobe_cloud_manager.result }}"
          JIRA="${{ needs.jira_release.result }}"
          PRS="${{ needs.notify_open_prs.result }}"
          if [ "$ACM" = "success" ] && [ "$JIRA" = "success" ] && [ "$PRS" = "success" ]; then
            echo "overall=success" >> "$GITHUB_OUTPUT"
          else
            echo "overall=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Send release cut summary to Slack
        run: node scripts/slack.js
        env:
          SLACK_WEBHOOK_URL:    ${{ vars.SLACK_WEBHOOK_URL }}
          NOTIFICATION_TYPE:    summary
          NEW_VERSION_LABEL:    ${{ env.NEW_VERSION_LABEL }}
          NEW_RELEASE_BRANCH:   ${{ env.NEW_RELEASE_BRANCH }}
          NEW_PRERELEASE_TAG:   ${{ env.NEW_PRERELEASE_TAG }}
          PREV_LATEST_TAG:      ${{ env.PREV_LATEST_TAG }}
          PREV_RELEASE_BRANCH:  ${{ env.PREV_RELEASE_BRANCH }}
          TICKET_COUNT:         ${{ needs.jira_release.outputs.ticket_count }}
          FILTER_URL:           ${{ needs.jira_release.outputs.filter_url }}
          JIRA_RELEASE_TICKET:  ${{ inputs.jira_release_ticket }}
          UNTAGGED_TICKETS:     ${{ needs.jira_release.outputs.untagged_open_tickets }}
          ACM_RESULT:           ${{ needs.adobe_cloud_manager.result }}
          JIRA_RESULT:          ${{ needs.jira_release.result }}
          PRS_RESULT:           ${{ needs.notify_open_prs.result }}
          GITHUB_ACTOR:         ${{ github.actor }}
          RUN_NUMBER:           ${{ github.run_number }}
          RUN_URL:              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}